# ==============================================================================
# AI Gateway 模块化单体 —— 全量配置
#
# 约定（修 P7：凭据不硬编码）：
#   - 敏感项全部走环境变量占位符 ${XXX:本地默认值}，本机零配置直接启动；
#   - 生产/演示脚本里用环境变量覆盖（见 scripts/start-all-windows.bat）。
# ==============================================================================

server:
  port: 10011
  # 优雅停机：SIGTERM/Ctrl+C 后停止接新请求，存量请求收尾后再退出（配合 logback 异步落盘）
  shutdown: graceful

spring:
  application:
    name: ai-gateway
  # 优雅停机各阶段收尾上限（SSE 存量流最多等 30s，超时强制收尾）
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # 虚拟线程（JDK 21）：IO 密集型网关的吞吐红利，servlet 容器请求线程虚拟化
  threads:
    virtual:
      enabled: true
  datasource:
    # MySQL 本地默认 root/root；生产覆盖 DB_USER/DB_PASSWORD
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_gateway}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 单机足够：写路径全在本地 MySQL，10 连接 + 2 备用
      maximum-pool-size: 12
      minimum-idle: 4
      connection-timeout: 5000
      # MySQL 8 小时断连保护
      max-lifetime: 1740000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 本地 Redis 默认无密码；生产覆盖 REDIS_PASSWORD
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  jackson:
    # 时间统一 UTC+8 序列化（前端直显）
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

# ============================== JWT（JwtInitializer 消费） ==============================
jwt:
  # 生产必须覆盖 JWT_SECRET（>= 32 字节，HS256 硬性要求）
  secret: ${JWT_SECRET:ai-gateway-local-dev-secret-key-32bytes!!}
  access-expire-minutes: 30
  refresh-expire-days: 7

# ============================== 入口防护（access 模块） ==============================
access:
  # 白名单：登录/文档/健康检查免认证（Ant 风格，JwtAuthFilter 匹配）
  whitelist:
    - /auth/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /doc.html
    - /webjars/**
    - /actuator/**
    - /settings/**   # 公开站点设置（登录页站点名/公告，仅暴露非敏感键）
    - /error
    - /favicon.ico
  # 固定窗口限流：每用户（未登录按 IP）每路径 100 次/60s
  rate-limit: 100
  rate-window-seconds: 60

# ============================== 智能路由（router 模块） ==============================
router:
  # 上游为 OpenAI 兼容服务（endpoint/api_key 随 t_model 行配置，支持 GLM/DeepSeek/Ollama 等混布）
  connect-timeout-ms: 3000
  call-timeout-ms: 180000
  stream-timeout-ms: 180000
  stream-idle-timeout-ms: 60000
  heartbeat-interval-ms: 15000
  # D6 报文采样目录（相对进程工作目录）
  payload-dir: data/payload
  payload-sample-enabled: true
  log-flush-interval-ms: 500

# ============================== MyBatis-Plus ==============================
mybatis-plus:
  configuration:
    # 驼峰映射：model_code ↔ modelCode
    map-underscore-to-camel-case: true
    # 生产关闭（课程演示期便于核对 SQL）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

# ============================== OpenAPI 文档（springdoc） ==============================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 文档聚合显示（六模块的 @Tag 自动归组）
    tags-sorter: alpha
    operations-sorter: alpha

# ============================== 健康检查 ==============================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

# ============================== 日志 ==============================
logging:
  level:
    root: info
    com.ai.gateway: info
    # SQL 调试期放开：com.ai.gateway: debug
# 输出格式与滚动策略见 logback-spring.xml（控制台 + 按天/100MB 滚动文件，traceId 走 MDC）
