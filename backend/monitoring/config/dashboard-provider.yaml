# Grafana 仪表盘自动装配（复制到 conf/provisioning/dashboards/ai-gateway.yaml）
# 路径相对 Grafana 工作目录（启动脚本已 pushd 到 grafana 根目录）
apiVersion: 1
providers:
  - name: ai-gateway
    folder: AI Gateway
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: conf/provisioning/dashboards/json
